name: Repository checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned actionlint
        run: bash scripts/ci-tools.sh lint
      - name: Check scripts, workflows and regression tests
        run: bash scripts/check.sh
