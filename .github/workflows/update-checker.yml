name: Update Checker

on:
  workflow_dispatch:
  schedule:
    # Daily at 11:17 Asia/Shanghai; avoid the busy top of the hour.
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:

    - uses: actions/checkout@v6

    - name: Resolve upstream, feeds, Go and theme versions
      id: inputs
      run: |
        fingerprint=$(python3 scripts/build_inputs.py resolve --output source-lock.json)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Check whether these inputs were already dispatched
      id: previous
      uses: actions/cache/restore@v5
      with:
        path: .dispatched-inputs
        key: dispatched-v2-${{ github.sha }}-${{ steps.inputs.outputs.fingerprint }}

    - name: Trigger build with the exact resolved inputs
      if: steps.previous.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        jq -n --slurpfile lock source-lock.json \
          '{event_type:"Source Code Update",client_payload:{lock:$lock[0]}}' > "$RUNNER_TEMP/dispatch.json"
        gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input "$RUNNER_TEMP/dispatch.json"
        cp source-lock.json .dispatched-inputs

    # Record only accepted dispatches; a failed API call must not suppress a retry.
    - name: Remember dispatched inputs
      if: steps.previous.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@v5
      with:
        path: .dispatched-inputs
        key: ${{ steps.previous.outputs.cache-primary-key }}
