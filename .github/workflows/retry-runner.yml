name: Retry lost hosted runner

on:
  workflow_run:
    workflows: [ImmortalWrt Builder]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Only inspect API metadata. Do not check out or execute the failed run's code.
      - name: Retry once only when failed jobs report a lost hosted runner
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            if (run.run_attempt !== 1 || run.conclusion !== 'failure' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                run.path !== '.github/workflows/immortalwrt.yml') {
              core.info('Skipping a run outside this repository/workflow.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, filter: 'latest', per_page: 100
            });
            const failed = jobs.filter(job => job.conclusion === 'failure');
            if (!failed.length) return;
            for (const job of failed) {
              const checkId = Number(job.check_run_url.split('/').pop());
              const notes = await github.paginate(github.rest.checks.listAnnotations, {
                ...repo, check_run_id: checkId, per_page: 100
              });
              const failures = notes.filter(note => note.annotation_level === 'failure');
              if (!failures.length || failures.some(note =>
                  !note.message.includes('The hosted runner lost communication with the server.'))) {
                core.info(`Job ${job.id} has a different or unknown failure; leaving it for diagnosis.`);
                return;
              }
            }
            await github.rest.actions.reRunWorkflowFailedJobs({...repo, run_id: run.id});
            await core.summary.addRaw(`Retried failed jobs once for run ${run.id}: hosted runner lost communication.`).write();
