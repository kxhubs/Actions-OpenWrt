name: ImmortalWrt Builder

on:
  push:
    tags:
    - 'v*'
  watch:
    types: [started]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      target:
        description: 'Build architectures'
        type: choice
        options: [both, R4S, x86_64]
        default: both
      upload_bin:
        description: 'Also upload all packages and intermediate bin outputs'
        type: boolean
        default: false

# Queue overlapping builds; never discard hours of work already in progress.
concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.target || 'both' }}
  cancel-in-progress: false

env:
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_BIN_DIR: ${{ inputs.upload_bin && 'true' || 'false' }}
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  SERVERCHAN_SCKEY: true
  TZ: Asia/Shanghai
  BUILD_INPUTS_LOCK: ${{ github.workspace }}/source-lock.json
  CCACHE_MAXSIZE: 768M
  SCCACHE_CACHE_SIZE: 128M
  SCCACHE_DIR: /workdir/cache/sccache

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  source:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6
    - name: Resolve source and dependency versions once
      id: resolve
      env:
        TARGET: ${{ inputs.target || 'both' }}
      run: |
        fingerprint=$(python3 scripts/build_inputs.py resolve --event "$GITHUB_EVENT_PATH" --output "$BUILD_INPUTS_LOCK")
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        case "$TARGET" in both|R4S|x86_64) ;; *) echo 'Unsupported build target' >&2; exit 1 ;; esac
        matrix=$(jq -cn --arg target "$TARGET" '{target: [{arch:"R4S",config:"immortalwrt_R4S",tag:"immortalwrt_R4S"},{arch:"x86_64",config:"immortalwrt_x64",tag:"immortalwrt_x64"}] | map(select($target == "both" or .arch == $target))}')
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
    - name: Share locked build inputs
      uses: actions/upload-artifact@v5
      with:
        name: Source_lock
        path: source-lock.json
        if-no-files-found: error

  build:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}

    steps:

    - name: Free Disk Space (Ubuntu)
      if: ${{ env.LOCAL_ACT != 'true' }}
      uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main, pinned for reproducibility
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Checkout
      uses: actions/checkout@v6

    - name: Download locked build inputs
      uses: actions/download-artifact@v6
      with:
        name: Source_lock

    - name: Install pinned Rust cache tool
      run: bash scripts/ci-tools.sh build

    - name: Check build resources
      run: |
        lscpu
        free -h
        lsblk
        df -hT
        jobs=$(nproc)
        memory_jobs=$(awk '/MemAvailable:/ {print int($2 / 1572864)}' /proc/meminfo)
        [ "$memory_jobs" -ge 1 ] || memory_jobs=1
        [ "$jobs" -le "$memory_jobs" ] || jobs=$memory_jobs
        echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"

    - name: TG Message
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        [ -n "$TG_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode "chat_id=$TGID" --data-urlencode "text=主人：正在为您编译新的${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M"),请耐心等待...... 😋💐" "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -o "$RUNNER_TEMP/notification.json"
        jq -e '.ok == true' "$RUNNER_TEMP/notification.json" >/dev/null

    - name: PUSHPLUS Message
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        [ -n "$PUSH_PLUS_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode token="$PUSH_PLUS_TOKEN" --data-urlencode title="开始编译${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M")" --data-urlencode "content=🎉 主人：正在为您编译新的${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M"),请耐心等待...... 😋💐" "https://www.pushplus.plus/send" -o "$RUNNER_TEMP/notification.json"
        jq -e '.code == 200' "$RUNNER_TEMP/notification.json" >/dev/null

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        build_packages=(build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ca-certificates patch perl tar xz-utils zstd libelf-dev device-tree-compiler jq)
        if [ "$(dpkg --print-architecture)" = amd64 ]; then
          build_packages+=(gcc-multilib g++-multilib)
        fi
        sudo -E apt-get -qq install "${build_packages[@]}"
        python3 -c 'import os, sysconfig; header = os.path.join(sysconfig.get_path("include"), "Python.h"); assert os.path.isfile(header), f"Missing Python development header: {header}"'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
        echo "$TZ" | sudo tee /etc/timezone >/dev/null
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Check local Node runtime
      if: ${{ env.LOCAL_ACT == 'true' }}
      run: |
        command -v node
        node --version

    - name: Clone source code at locked commit
      run: |
        df -hT /workdir
        python3 scripts/build_inputs.py checkout --lock "$BUILD_INPUTS_LOCK" immortalwrt /workdir/openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Load custom configuration
      run: |
        if [ -d files ]; then mkdir -p openwrt/files; cp -a files/. openwrt/files/; fi
        cp "config/${{ matrix.target.config }}" openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Include latest GeoIP and Geosite
      run: |
        set -euo pipefail
        rules_url=https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
        rules_dir="$GITHUB_WORKSPACE/openwrt/files/usr/share/v2ray"
        mkdir -p "$rules_dir"
        for rule in geoip geosite; do
          curl -fL --retry 3 -o "$RUNNER_TEMP/$rule.dat" "$rules_url/$rule.dat"
          curl -fL --retry 3 -o "$RUNNER_TEMP/$rule.dat.sha256sum" "$rules_url/$rule.dat.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum -c "$rule.dat.sha256sum")
          install -m 0644 "$RUNNER_TEMP/$rule.dat" "$rules_dir/$rule.dat"
          sha256sum "$rules_dir/$rule.dat"
        done

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Configure compiler caches and resolve configuration
      id: cache_config
      run: |
        python3 scripts/ci_cache.py configure --root /workdir/openwrt
        cd openwrt
        make defconfig
        for setting in CONFIG_CCACHE=y CONFIG_RUST_SCCACHE=y; do grep -qx "$setting" .config; done
        xray_version=$(sed -n 's/^PKG_VERSION:=//p' package/feeds/passwall_packages/xray-core/Makefile)
        echo "Xray-core source version: $xray_version"
        dpkg --compare-versions "$xray_version" ge 26.9.30
        for package in xray-core v2ray-geoip v2ray-geosite; do
          grep -qx "CONFIG_PACKAGE_${package}=y" .config
        done
        cd "$GITHUB_WORKSPACE"
        scope=$(python3 scripts/ci_cache.py scope --root /workdir/openwrt --lock "$BUILD_INPUTS_LOCK")
        echo "scope=$scope" >> "$GITHUB_OUTPUT"

    - name: Restore download cache
      id: download_cache
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: /workdir/openwrt/dl
        key: downloads-v1-${{ runner.os }}-${{ matrix.target.arch }}-${{ needs.source.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          downloads-v1-${{ runner.os }}-${{ matrix.target.arch }}-

    - name: Restore compiler caches
      id: compiler_cache
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: /workdir/cache
        key: compilers-v1-${{ runner.os }}-ubuntu22-${{ matrix.target.arch }}-${{ steps.cache_config.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          compilers-v1-${{ runner.os }}-ubuntu22-${{ matrix.target.arch }}-${{ steps.cache_config.outputs.scope }}-

    - name: Download package
      run: |
        cd openwrt
        make download -j"$BUILD_JOBS"
        # OpenWrt verifies source checksums; small archives may be legitimate.

    - name: Record build inputs
      run: |
        mkdir -p build-info
        git rev-parse HEAD > build-info/configuration.commit
        git -C openwrt rev-parse HEAD > build-info/immortalwrt.commit
        git -C openwrt log -1 --format=%s > build-info/immortalwrt.subject
        git -C openwrt log -1 --format=%cd --date=iso-strict > build-info/immortalwrt.date
        cp openwrt/.config build-info/config
        cp "$BUILD_INPUTS_LOCK" build-info/source-lock.json
        for directory in openwrt/feeds/* openwrt/feeds/packages/lang/golang openwrt/package/luci-theme-aurora; do
          if [ -d "$directory/.git" ] || [ -f "$directory/.git" ]; then
            printf '%s %s\n' "$directory" "$(git -C "$directory" rev-parse HEAD)" >> build-info/dependencies.txt
          fi
        done
        cp openwrt/feeds.conf.default build-info/feeds.conf.default
        (cd "$RUNNER_TEMP" && sha256sum geoip.dat geosite.dat) > build-info/rules.sha256

    - name: Upload build inputs
      uses: actions/upload-artifact@v5
      with:
        name: Build_inputs_${{ matrix.target.arch }}
        path: build-info
        if-no-files-found: error

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        started=$SECONDS
        echo "$BUILD_JOBS thread compile"
        if ! make -j"$BUILD_JOBS"; then
          echo '::warning::Parallel build failed; retrying with one job for diagnostics'
          echo 'Diagnostic retry: single thread' >> "$GITHUB_STEP_SUMMARY"
          make -j1 V=s
        fi
        echo "Compile duration: $((SECONDS - started)) seconds; jobs: $BUILD_JOBS" >> "$GITHUB_STEP_SUMMARY"
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -hT
        df -hT /workdir >> "$GITHUB_STEP_SUMMARY"

    - name: Report and bound caches
      id: cache_finish
      continue-on-error: true
      if: success()
      run: |
        {
          echo '### Compiler cache statistics'
          echo "Download cache: ${{ steps.download_cache.outputs.cache-matched-key || 'cold' }}"
          echo "Compiler cache: ${{ steps.compiler_cache.outputs.cache-matched-key || 'cold' }}"
          CCACHE_DIR=/workdir/cache/ccache openwrt/staging_dir/host/bin/ccache --show-stats || echo 'ccache statistics unavailable'
          sccache --show-stats || echo 'sccache statistics unavailable'
        } >> "$GITHUB_STEP_SUMMARY"
        sccache --stop-server || echo 'sccache server was not running'
        python3 scripts/ci_cache.py trim --root /workdir/openwrt

    - name: Save download cache
      if: success() && steps.cache_finish.outcome == 'success' && steps.download_cache.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.download_cache.outputs.cache-primary-key }}

    - name: Save compiler caches
      if: success() && steps.cache_finish.outcome == 'success' && steps.compiler_cache.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: /workdir/cache
        key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

    - name: Upload bin directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_BIN_DIR == 'true' && success()
      with:
        name: OpenWrt_bin_${{ matrix.target.arch }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        compression-level: 0
        retention-days: 7

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && success()
      run: |
        cd openwrt/bin/targets/*/*
         rm -rf packages
         # Per-architecture: x64 keeps EFI only, R4S keeps ext4/squashfs
         case "$(pwd)" in
           *x86*) find . -type f ! -name "*combined-efi.img*" -delete ;;
           *)     find . -type f ! -name "*ext4*.img*" ! -name "*squashfs*.img*" -delete ;;
         esac
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_FIRMWARE == 'true' && success()
      with:
        if-no-files-found: error
        name: OpenWrt_firmware_${{ matrix.target.arch }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        compression-level: 0
        retention-days: 7

    - name: TG Message (success)
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true' && success()
      run: |
        [ -n "$TG_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode "chat_id=$TGID" --data-urlencode "text=✅ 我亲爱的主人您要编译的${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M")固件编译成功！" "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -o "$RUNNER_TEMP/notification.json"
        jq -e '.ok == true' "$RUNNER_TEMP/notification.json" >/dev/null

    - name: PUSHPLUS Message (success)
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true' && success()
      run: |
        [ -n "$PUSH_PLUS_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode token="$PUSH_PLUS_TOKEN" --data-urlencode title="✅ 恭喜主人${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M")固件编译成功！" --data-urlencode "content=✅ 我亲爱的主人您要编译的${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M")固件成功完成了！" "https://www.pushplus.plus/send" -o "$RUNNER_TEMP/notification.json"
        jq -e '.code == 200' "$RUNNER_TEMP/notification.json" >/dev/null

    - name: TG Message (fail)
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true' && failure()
      run: |
        [ -n "$TG_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode "chat_id=$TGID" --data-urlencode "text=❌ 主人：${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M") 编译失败，请检查日志！" "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -o "$RUNNER_TEMP/notification.json"
        jq -e '.ok == true' "$RUNNER_TEMP/notification.json" >/dev/null

    - name: PUSHPLUS Message (fail)
      continue-on-error: true
      env:
        TGID: ${{ secrets.TGID }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      if: env.SERVERCHAN_SCKEY == 'true' && failure()
      run: |
        [ -n "$PUSH_PLUS_TOKEN" ] || exit 0
        curl --fail-with-body --connect-timeout 10 --max-time 30 --silent --show-error --data-urlencode token="$PUSH_PLUS_TOKEN" --data-urlencode title="❌ 主人：${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M") 编译失败" --data-urlencode "content=❌ 主人：${{ matrix.target.tag }}-$(date +"%Y.%m.%d-%H%M") 编译失败，请检查日志！" "https://www.pushplus.plus/send" -o "$RUNNER_TEMP/notification.json"
        jq -e '.code == 200' "$RUNNER_TEMP/notification.json" >/dev/null

  publish:
    permissions:
      contents: write
      actions: write
    name: Publish combined firmware release
    needs: [source, build]
    runs-on: ubuntu-22.04

    steps:
    - name: Download all firmware artifacts
      uses: actions/download-artifact@v6
      with:
        pattern: OpenWrt_firmware_*
        path: firmware
        merge-multiple: true

    - name: Download build inputs
      uses: actions/download-artifact@v6
      with:
        pattern: Build_inputs_*
        path: build-inputs

    - name: Generate combined release notes
      id: tag
      env:
        TARGET_MATRIX: ${{ needs.source.outputs.matrix }}
      run: |
        BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')
        RELEASE_TAG="ImmortalWrt_${{ github.run_number }}.${{ github.run_attempt }}_$(date +'%Y.%m.%d-%H%M')"
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        FIRST_ARCH=$(jq -r '.target[0].arch' <<< "$TARGET_MATRIX")
        ARCHITECTURES=$(jq -r '[.target[].arch] | join(" / ")' <<< "$TARGET_MATRIX")
        UPSTREAM_SUBJECT=$(cat "build-inputs/Build_inputs_$FIRST_ARCH/immortalwrt.subject")
        UPSTREAM_DATE=$(cat "build-inputs/Build_inputs_$FIRST_ARCH/immortalwrt.date")
        UPSTREAM_COMMIT=$(cat "build-inputs/Build_inputs_$FIRST_ARCH/immortalwrt.commit")
        {
          echo "# 🎉 ImmortalWrt 固件 ${RELEASE_TAG}"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 架构 | $ARCHITECTURES |"
          echo "| 构建时间 | $BUILD_TIME |"
          echo "| 构建号 | #${{ github.run_number }} |"
          echo "| 上游更新 | $UPSTREAM_SUBJECT |"
          echo "| 上游提交 | $UPSTREAM_COMMIT |"
          echo "| 上游时间 | $UPSTREAM_DATE |"
          echo ""
          echo "## 📥 镜像格式"
          echo ""
          if [[ "$ARCHITECTURES" == *x86_64* ]]; then echo "- x86_64 — combined EFI 镜像"; fi
          if [[ "$ARCHITECTURES" == *R4S* ]]; then echo "- R4S — ext4 与 squashfs 镜像"; fi
          echo ""
          echo "---"
          echo ""
          echo "> 同一次构建的所有架构镜像统一发布"
        } > release.txt
        tar -czf build-inputs.tar.gz build-inputs

    - name: Upload all firmware to one release
      uses: softprops/action-gh-release@v3
      if: env.UPLOAD_RELEASE == 'true' && success()
      env:
        GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          firmware/*
          build-inputs.tar.gz
        fail_on_unmatched_files: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
      with:
        retain_days: 1
        keep_minimum_runs: 3
